name: Deploy (Cloudflare Worker + Student Web)

# Manual only. Required repository secrets:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit, D1:Edit, Pages:Edit, Account Settings:Read)
#   JWT_SECRET            (>= 32 random characters)
# Optional secret: CLOUDFLARE_ACCOUNT_ID (auto-detected when the token sees exactly one account)
# Optional secret: AVALAI_API_KEY (enables the AvalAI provider of the AI Activity Builder; without it the rule engine is used)
# Optional repo variable: AVALAI_MODEL (pinned model id; default in code)
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply D1 migrations
        type: boolean
        default: true

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Preflight
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test "${#JWT}" -ge 32 || { echo "::error::JWT_SECRET secret must be at least 32 characters"; exit 1; }
        env: { JWT: "${{ secrets.JWT_SECRET }}" }

      - name: Resolve account id
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            RES=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
            N=$(echo "$RES" | jq '.result | length')
            [ "$N" = "1" ] || { echo "::error::Token sees $N accounts; set CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$(echo "$RES" | jq -r '.result[0].id')" >> "$GITHUB_ENV"
          fi

      - run: npm ci
        working-directory: worker

      # Student Web is served by the Worker itself (static assets, same origin as /api) → build it first.
      - name: Build Student Web (same-origin API)
        working-directory: student-web
        run: |
          npm ci
          npm run build
        env: { VITE_API_BASE: "" }

      - name: Ensure D1 database
        working-directory: worker
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="yadbin-db") | .uuid' | head -n1)
          if [ -z "$ID" ]; then
            npx wrangler d1 create yadbin-db
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="yadbin-db") | .uuid' | head -n1)
          fi
          test -n "$ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.toml

      - name: Apply migrations
        if: ${{ inputs.migrate }}
        working-directory: worker
        run: npm run db:migrate:remote

      - name: Deploy Worker
        working-directory: worker
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -n1)
          test -n "$URL" || { echo "::error::could not detect Worker URL"; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          printf '%s' "$JWT" | npx wrangler secret put JWT_SECRET
          if [ -n "$AVALAI" ]; then printf '%s' "$AVALAI" | npx wrangler secret put AVALAI_API_KEY; else echo "AVALAI_API_KEY not set → AI builder uses the rule engine"; fi
        env:
          JWT: "${{ secrets.JWT_SECRET }}"
          AVALAI: "${{ secrets.AVALAI_API_KEY }}"


      - name: Smoke test
        run: |
          echo "::notice title=Game URL::$WORKER_URL/play/{token}"
          ok=0
          for i in 1 2 3 4 5 6; do
            H=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "$WORKER_URL/api/health" || true)
            P=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "$WORKER_URL/play/AAAAAAAAAAAAAAAA" || true)
            T=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "$WORKER_URL/api/play/AAAAAAAAAAAAAAAA" || true)
            echo "try $i: health=$H play-page=$P invalid-token-api=$T"
            if [ "$H" = 200 ] && [ "$P" = 200 ] && [ "$T" = 404 ]; then ok=1; break; fi
            sleep 10
          done
          echo "::notice title=Smoke test::health=$H play-page=$P invalid-token-api=$T"
          [ "$ok" = 1 ] || { echo "::error::smoke test failed"; exit 1; }

      - name: Summary
        run: |
          echo "Game links: $WORKER_URL/play/{token}" >> "$GITHUB_STEP_SUMMARY"
          echo "Remember: PLAY_BASE_URL in worker/wrangler.toml must equal $WORKER_URL (or your custom domain)." >> "$GITHUB_STEP_SUMMARY"
