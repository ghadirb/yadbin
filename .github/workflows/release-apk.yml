name: Release APK (signed, for Myket)

# Builds the SIGNED release APK of the teacher app with the fixed key stored in repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional repo variables: API_BASE_URL (backend), MYKET_PUBLIC_KEY (in-app purchase; empty = billing disabled).
# Run: Actions → "Release APK" → Run workflow. Output: workflow artifact + a GitHub Release with a fixed download link.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release-apk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }

      - name: Restore the fixed signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/yadbin-release.jks"

      - name: Build signed release APK
        working-directory: teacher-android
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MYKET_PUBLIC_KEY: ${{ vars.MYKET_PUBLIC_KEY }}
          VERSION_CODE: ${{ github.run_number }}
          YADBIN_KEYSTORE_PATH: ${{ runner.temp }}/yadbin-release.jks
          YADBIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YADBIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YADBIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain assembleRelease

      - name: Verify signature and name the file
        run: |
          APK=$(ls teacher-android/app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt
          grep -q "SHA-256 digest" cert.txt
          mkdir -p dist
          cp "$APK" "dist/yadbin-teacher-release.apk"
          sha256sum dist/yadbin-teacher-release.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: yadbin-teacher-release-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (fixed link, latest build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/yadbin-teacher-release.apk dist/SHA256.txt \
            --title "یادبین build ${{ github.run_number }}" \
            --notes "Signed release APK (fixed key). versionCode=${{ github.run_number }}. Upload yadbin-teacher-release.apk to Myket." \
            --target "${{ github.sha }}" --latest
