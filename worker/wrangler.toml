name = "yadbin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Dev/production separation: real IDs and secrets are NOT committed.
# Secrets: `wrangler secret put JWT_SECRET`
[[d1_databases]]
binding = "DB"
database_name = "yadbin-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# The Student Web is served by this same Worker (static assets below), so the API is same-origin.
# PLAY_BASE_URL = the public origin of the Worker (workers.dev, or your custom domain later).
ALLOWED_ORIGIN = "https://yadbin-api.ghadir-baraty3.workers.dev"
PLAY_BASE_URL = "https://yadbin-api.ghadir-baraty3.workers.dev"

# Student Web (built by `npm run build` in ../student-web) is served from the same origin as the API.
# Only /api/* runs Worker code; every other path is a static file, with SPA fallback to index.html (/play/{token}).
[assets]
directory = "../student-web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Optional (v1.2 AI Activity Builder): uncomment to let the builder use Cloudflare Workers AI.
# Without it the builder still works with its built-in rule engine. The model only ever returns a DRAFT.
# [ai]
# binding = "AI"
